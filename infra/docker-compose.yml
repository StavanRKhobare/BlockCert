version: "3.8"

# Local dev infra so blockchain/ and rollback-service/ can be built and
# tested fully offline, with zero dependency on the vision model.

services:
  testnet:
    # Ethereum-style local testnet (e.g. Hardhat/Anvil node) — swap image
    # for whichever tool blockchain/scripts/deploy.py targets.
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--host", "0.0.0.0"]
    ports:
      - "8545:8545"

  ipfs:
    image: ipfs/kubo:latest
    ports:
      - "5001:5001"   # API, used by rollback-service/checkpoint_store/ipfs_client.py
      - "8080:8080"   # gateway
    volumes:
      - ipfs_data:/data/ipfs

volumes:
  ipfs_data:
